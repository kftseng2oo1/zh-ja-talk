<title>對面說 — 中文 × 日語 / 韓語 / 英語 面對面翻譯</title>

<style>
:root{
  --paper:#f7f4ec;      /* 和紙 */
  --ink:#1c2a5a;        /* 藍染 */
  --ink-soft:#4a5680;
  --vermilion:#c8412a;  /* 朱 */
  --line:#d9d3c4;
  --bubble-me:#ffffff;
  --bubble-them:#e8ecf6;
  --fs:1;            /* 字級倍率，A 鈕切換 */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);color-scheme:light;
  font-family:-apple-system,"PingFang TC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans TC","Noto Sans JP","Noto Sans KR","Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;background:var(--paper);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

.side{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:var(--paper)}
.side.them{transform:rotate(180deg)}
.side.them.upright{transform:none}

.divider{flex:none;min-height:42px;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px}
.divider button{-webkit-appearance:none;appearance:none}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:#999;margin-right:2px}
.dot.ok{background:#3fa34d}.dot.bad{background:var(--vermilion)}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--paper);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;line-height:1;white-space:nowrap}
.seg button.on,.seg button[aria-pressed="true"]{background:var(--paper) !important;color:var(--ink) !important}
.divider .flip{flex:none;background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.45);border-radius:999px;
  padding:6px 9px;font-size:13px;font-weight:600;line-height:1;white-space:nowrap}
.fsbtn{flex:none;border:0;background:transparent;color:var(--paper);font-weight:700;font-size:15px;padding:6px 4px;line-height:1}
@media (max-width:360px){.seg button{padding:6px 7px;font-size:12px}.divider .flip{padding:6px 7px;font-size:12px}}

.log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.empty{color:var(--ink-soft);font-size:calc(15px*var(--fs));line-height:1.6;text-align:center;margin:auto;padding:0 20px}
.empty b{display:block;font-size:calc(22px*var(--fs));color:var(--ink);margin-bottom:6px}

.msg{max-width:88%;border-radius:18px;padding:10px 14px;line-height:1.45;position:relative;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--bubble-me);border:1px solid var(--line);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--bubble-them);border-bottom-left-radius:6px}
.msg .big{font-size:calc(26px*var(--fs));font-weight:600;line-height:1.35}
.msg.me .big{font-size:calc(20px*var(--fs));font-weight:500}
.msg .sub{font-size:calc(14px*var(--fs));color:var(--ink-soft);margin-top:4px}
.msg .say{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;
  border:0;background:var(--vermilion);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.msg.pending .big{color:var(--ink-soft);font-weight:400;font-size:calc(18px*var(--fs))}
.msg.error{background:#fbe9e5}.msg.error .big{font-size:calc(18px*var(--fs));color:var(--vermilion)}

.bar{flex:none;padding:8px 10px 10px;border-top:1px solid var(--line);background:var(--paper)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:calc(14px*var(--fs));white-space:nowrap}
.row{display:flex;gap:8px;align-items:flex-end}
.row textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:14px;background:#fff;
  font:inherit;font-size:calc(17px*var(--fs));padding:10px 12px;min-height:44px;max-height:120px;line-height:1.35;color:var(--ink)}
.row textarea:focus{outline:none;border-color:var(--ink)}
.btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.btn.mic{background:var(--ink);color:var(--paper)}
.btn.mic.on{background:var(--vermilion);animation:pulse 1s infinite}
.btn.mic.off{opacity:.35}
.btn.send{background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-weight:700;font-size:16px}
.btn:active{transform:scale(.94)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,65,42,.5)}50%{box-shadow:0 0 0 10px rgba(200,65,42,0)}}
@media (prefers-reduced-motion:reduce){.btn.mic.on{animation:none}}

.btn.book{background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:20px}
.book{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--paper);z-index:8;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.book.open{display:flex}
.book.rot{transform:rotate(180deg)}
.book-head{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.book-head input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.book-head input:focus{outline:none;border-color:var(--ink)}
.book-head button{border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:600;padding:8px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;flex:none;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.cats button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.book-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 12px}
.ph{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;color:var(--ink);font:inherit}
.ph .z{font-size:calc(16px*var(--fs));font-weight:600}
.ph .f{font-size:calc(17px*var(--fs));margin-top:2px}
.ph .r{font-size:calc(13px*var(--fs));color:var(--ink-soft)}
.book-note{font-size:13px;color:var(--ink-soft);padding:6px 12px 0;text-align:center}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:80%;text-align:center;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">

  <!-- 中文這一面（自己） -->
  <section class="side zh" id="side-zh">
    <div class="log" id="log-zh">
      <div class="empty"><b>對面說</b>你說中文，對面顯示<span id="empty-zh-lang">日文</span>。<br>按麥克風說話，或直接打字。</div>
    </div>
    <div class="bar">
      <div class="chips" id="chips-zh"></div>
      <div class="row">
        <button class="btn book" id="book-zh" aria-label="片語本">📖</button>
        <button class="btn mic" id="mic-zh" aria-label="中文語音輸入">🎤</button>
        <textarea id="in-zh" rows="1" placeholder="說中文…" enterkeyhint="send"></textarea>
        <button class="btn send" id="send-zh" aria-label="送出">譯</button>
      </div>
    </div>
  </section>

  <div class="divider">
    <span class="dot" id="dot" title="伺服器連線"></span>
    <div class="seg" id="seg">
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <button type="button" class="flip" id="flip">翻轉 ⟲</button>
    <button type="button" class="fsbtn" id="fsbtn" aria-label="字體大小">A<small>A</small></button>
  </div>

  <!-- 對方那一面（日文或韓文，預設旋轉 180°） -->
  <section class="side them" id="side-them">
    <div class="log" id="log-them">
      <div class="empty" id="empty-them"></div>
    </div>
    <div class="bar">
      <div class="chips" id="chips-them"></div>
      <div class="row">
        <button class="btn book" id="book-them" aria-label="片語本">📖</button>
        <button class="btn mic" id="mic-them" aria-label="語音輸入">🎤</button>
        <textarea id="in-them" rows="1" placeholder="" enterkeyhint="send"></textarea>
        <button class="btn send" id="send-them" aria-label="送出">訳</button>
      </div>
    </div>
  </section>

</div>
<div class="book" id="book">
  <div class="book-head">
    <input id="book-q" type="search" placeholder="搜尋片語（中文或外語）" autocomplete="off">
    <button type="button" id="book-close">關閉</button>
  </div>
  <div class="cats" id="cats"></div>
  <div class="book-note">離線片語本：不需網路。點一下就顯示給對面並朗讀。</div>
  <div class="book-list" id="book-list"></div>
</div>
<div class="toast" id="toast"></div>

  function readingOf(p, lang){ return lang==='ja' ? p.jr : lang==='ko' ? p.kr : ''; }
  var them = 'ja';   // 對面目前的語言
  try{ var saved = localStorage.getItem('them-lang'); if(saved && LANG[saved]) them = saved; }catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var SIDE = { zh:'zh', them:'them' };
  var logs = { zh:$('log-zh'), them:$('log-them') };
  var inputs = { zh:$('in-zh'), them:$('in-them') };

  /* ── toast ── */
  var toastTimer;
  function toast(t){
    var el = $('toast'); el.textContent = t; el.className = 'toast show';
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.className = 'toast'; }, 4000);
  }

  /* ── 依對面語言重繪 UI ── */
  function buildChips(side, list){
    var box = $('chips-'+side); box.innerHTML = '';
    list.forEach(function(p){
      var b = document.createElement('button'); b.type='button'; b.textContent = p;
      b.addEventListener('click', function(){ unlockTTS(); send(side, p); });
      box.appendChild(b);
    });
  }
  function applyLang(){
    var L = LANG[them];
    buildChips('zh', L.zhChips);
    buildChips('them', L.chips);
    inputs.them.placeholder = L.placeholder;
    $('send-them').textContent = L.sendLabel;
    $('empty-zh-lang').textContent = L.cn;
    var e = $('empty-them');
    if(e){ e.innerHTML=''; var b=document.createElement('b'); b.textContent=L.emptyTitle; e.appendChild(b);
      L.emptyBody.split('\n').forEach(function(line,i){ if(i) e.appendChild(document.createElement('br')); e.appendChild(document.createTextNode(line)); }); }
    var segs = $('seg').querySelectorAll('button');
    for(var i=0;i<segs.length;i++){
      var on = segs[i].getAttribute('data-lang')===them;
      segs[i].className = on ? 'on' : '';
      segs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      segs[i].style.background = on ? '#f7f4ec' : 'transparent';
      segs[i].style.color = on ? '#1c2a5a' : '#f7f4ec';
    }
    document.title = '對面說 — 中文 × '+L.cn;
  }
  $('seg').addEventListener('click', function(e){
    var b = e.target;
    while(b && b!==this && b.tagName!=='BUTTON') b = b.parentNode;
    if(!b || b===this || !b.getAttribute('data-lang')) return;
    var l = b.getAttribute('data-lang');
    if(l===them) return;
    stopRec();
    them = l; try{ localStorage.setItem('them-lang', l); }catch(err){}
    applyLang();
    toast('對面改為'+LANG[l].cn+'，之前的對話保留');
  });

  /* ── 語音合成 ── */
  var HAS_TTS = ('speechSynthesis' in window);
  var ttsUnlocked = false;
  // iOS 規定：朗讀必須在使用者手勢裡先「解鎖」一次，否則翻譯回來後（非手勢情境）第一句會被吃掉
  function unlockTTS(){
    if(!HAS_TTS || ttsUnlocked) return;
    ttsUnlocked = true;
    try{
      var u = new SpeechSynthesisUtterance('\u200B'); u.volume = 0; u.rate = 2;
      speechSynthesis.speak(u);
      speechSynthesis.getVoices();
    }catch(e){}
  }
  function pickVoice(lang){
    var voices = speechSynthesis.getVoices(), pre = LANG[lang].code.split('-')[0], exact = null, loose = null;
    for(var i=0;i<voices.length;i++){
      var l = voices[i].lang.replace('_','-');
      if(l===LANG[lang].code && !exact) exact = voices[i];
      else if(l.indexOf(pre)===0 && !loose) loose = voices[i];
    }
    return exact || loose;
  }
  function speak(text, lang){
    if(!HAS_TTS){ toast('此裝置不支援朗讀'); return; }
    unlockTTS();
    speechSynthesis.cancel();
    // iOS 在 cancel() 後立刻 speak() 常常沒聲音，稍等一下再講
    setTimeout(function(){
      var u = new SpeechSynthesisUtterance(text);
      u.lang = LANG[lang].code; u.rate = 0.95;
      var v = pickVoice(lang); if(v) u.voice = v;
      try{ speechSynthesis.resume(); }catch(e){}
      speechSynthesis.speak(u);
    }, 120);
  }
  if(HAS_TTS){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); };
    // 第一次碰螢幕就解鎖（touchend / click 都算手勢）
    document.addEventListener('touchend', unlockTTS, {passive:true});
    document.addEventListener('click', unlockTTS);
  }

  /* ── 語音辨識 ── */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, recSide = null;
  function startRec(side){
    if(!SR){ toast('此瀏覽器不支援語音輸入，請打字'); return; }
    if(rec){ stopRec(); return; }
    var lang = langOf(side);
    rec = new SR(); recSide = side;
    rec.lang = LANG[lang].code; rec.interimResults = true; rec.continuous = false;
    mics[side].className = 'btn mic on';
    rec.onresult = function(e){
      var t = '';
      for(var i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
      inputs[side].value = t;
      if(e.results[e.results.length-1].isFinal){ stopRec(); send(side, t); }
    };
    rec.onerror = function(e){ stopRec(); if(e.error!=='no-speech' && e.error!=='aborted') toast('語音輸入失敗：'+e.error); };
    rec.onend = function(){ stopRec(); };
    try{ rec.start(); }catch(err){ stopRec(); toast('無法啟動麥克風'); }
  }
  function stopRec(){
    if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} }
    if(recSide) mics[recSide].className = 'btn mic';
    rec = null; recSide = null;
  }
  if(!SR){ mics.zh.className = 'btn mic off'; mics.them.className = 'btn mic off'; }

  /* ── 對話氣泡 ── */
  function clearEmpty(side){
    var e = logs[side].querySelector('.empty'); if(e) e.parentNode.removeChild(e);
  }
  function addBubble(side, kind, big, sub, speakLang){
    clearEmpty(side);
    var d = document.createElement('div'); d.className = 'msg '+kind;
    var b = document.createElement('div'); b.className = 'big'; b.textContent = big; d.appendChild(b);
    if(sub){ var s = document.createElement('div'); s.className='sub'; s.textContent = sub; d.appendChild(s); }
    if(speakLang){
      var btn = document.createElement('button'); btn.className='say'; btn.textContent='🔊'; btn.type='button';
      btn.setAttribute('aria-label','朗讀');
      btn.addEventListener('click', function(){ speak(big, speakLang); });
      d.appendChild(btn);
    }
    logs[side].appendChild(d);
    logs[side].scrollTop = logs[side].scrollHeight;
    return d;
  }

  /* ── 翻譯快取（成功過的句子存手機，離線可重用） ── */
  var CACHE_KEY = 'tx-cache-v1', cache = {};
  try{ cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}') || {}; }catch(e){ cache = {}; }
  function cacheGet(from,to,text){ return cache[from+'>'+to+'|'+text] || null; }
  function cacheSet(from,to,text,res){
    cache[from+'>'+to+'|'+text] = {t:res.t, r:res.r||''};
    var keys = Object.keys(cache);
    if(keys.length>400){ keys.slice(0, keys.length-400).forEach(function(k){ delete cache[k]; }); }
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); }catch(e){}
  }
  function norm(t){ return t.replace(/[\s？?！!。．.，,、～~]/g,'').toLowerCase(); }
  /* 離線時在片語本找最接近的句子 */
  function lookupPhrase(text, from, to){
    var q = norm(text); if(!q) return null;
    var best = null, bestScore = 0;
    PHRASES.forEach(function(p){
      var src = from==='zh' ? p.zh : p[from];
      var n = norm(src);
      var score = 0;
      if(n===q) score = 3;
      else if(n.indexOf(q)>-1 || q.indexOf(n)>-1) score = 2 - Math.abs(n.length-q.length)/Math.max(n.length,q.length);
      if(score>bestScore){ bestScore = score; best = p; }
    });
    if(!best || bestScore<1.4) return null;
    return to==='zh' ? {t:best.zh, r:''} : {t:best[to], r:readingOf(best,to)};
  }

  /* ── 翻譯 ── */
  function translate(text, from, to){
    var hit = cacheGet(from,to,text);
    if(hit) return Promise.resolve(hit);
    if(navigator.onLine===false){
      var p = lookupPhrase(text, from, to);
      return p ? Promise.resolve(p) : Promise.reject(new Error('offline'));
    }
    var readingRule = to==='zh' ? 'r 留空字串' : LANG[to].reading;
    var prompt =
      '你是一位專業的口譯員，正在協助兩個人面對面交談。\n'+
      '請把下面這句「'+LANG[from].name+'」翻譯成「'+LANG[to].name+'」，口語、自然、有禮貌，保留原意，不要加註解。\n'+
      '只回傳 JSON（不要用 ```），格式：{"t":"翻譯結果","r":"讀音"}\n'+
      '「r」的規則：'+readingRule+'。\n\n'+
      '原文：'+text;
    return fetch(ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:MODEL, max_tokens:400, messages:[{role:'user', content:prompt}] })
    }).then(function(r){
      return r.text().then(function(t){
        var d; try{ d = JSON.parse(t); }catch(e){ throw new Error('HTTP '+r.status+'：'+t.slice(0,80)); }
        if(!r.ok && !d.error) throw new Error('HTTP '+r.status);
        return d;
      });
    }).then(function(data){
      if(data.error) throw new Error(typeof data.error==='string' ? data.error : (data.error.message || JSON.stringify(data.error)));
      var txt = '';
      (data.content||[]).forEach(function(c){ if(c.type==='text') txt += c.text; });
      txt = txt.replace(/```json|```/g,'').trim();
      var m = txt.match(/\{[\s\S]*\}/);
      var obj = JSON.parse(m ? m[0] : txt);
      if(!obj.t) throw new Error('empty');
      cacheSet(from,to,text,obj);
      return obj;
    }).catch(function(err){
      // 網路失敗 → 再試片語本
      var msg = err.message||'';
      if(msg==='Failed to fetch' || msg==='Load failed'){
        var p = lookupPhrase(text, from, to);
        if(p) return p;
      }
      throw err;
    });
  }

  function send(side, text){
    text = (text || inputs[side].value).trim();
    if(!text || busy) return;
    busy = true;
    var from = langOf(side), toSide = otherSide(side), to = langOf(toSide);
    inputs[side].value = ''; autosize(inputs[side]);
    addBubble(side, 'me', text, null, null);
    var pending = addBubble(toSide, 'pending them', to==='zh' ? '翻譯中…' : LANG[to].pending, null, null);
    translate(text, from, to).then(function(res){
      pending.parentNode.removeChild(pending);
      addBubble(toSide, 'them', res.t, null, to);                    // 對面看到的翻譯
      var mine = addBubble(side, 'me', res.t, res.r || null, to);    // 自己這邊也看到，方便跟著唸
      mine.style.background = '#fbfaf6';
      speak(res.t, to);
    }).catch(function(err){
      var msg = err.message || '網路錯誤';
      if(msg==='offline') msg = '沒有網路，片語本裡也找不到這句。請按 📖 挑選片語';
      else if(msg==='Failed to fetch' || msg==='Load failed') msg = navigator.onLine===false ? '手機目前沒有網路，請用 📖 片語本' : '連不到伺服器（'+ENDPOINT.replace(/^https?:\/\//,'')+'）';
      pending.className = 'msg them error';
      pending.querySelector('.big').textContent = to==='zh' ? '翻譯失敗' : LANG[to].fail;
      var s = document.createElement('div'); s.className='sub'; s.textContent = msg; pending.appendChild(s);
      toast('翻譯失敗：'+msg);
      inputs[side].value = text;
    }).then(function(){ busy = false; });
  }

  /* ── 輸入框 ── */
  function autosize(ta){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight, 120)+'px'; }
  ['zh','them'].forEach(function(side){
    var ta = inputs[side];
    ta.addEventListener('input', function(){ autosize(ta); });
    ta.addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(side); }
    });
    $('send-'+side).addEventListener('click', function(){ unlockTTS(); send(side); });
    mics[side].addEventListener('click', function(){ unlockTTS(); startRec(side); });
  });

  /* ── 片語本 UI ── */
  var bookSide = 'zh', bookCat = '全部';
  var CATS = ['全部'];
  PHRASES.forEach(function(p){ if(CATS.indexOf(p.c)<0) CATS.push(p.c); });
  function openBook(side){
    stopRec();
    bookSide = side;
    var b = $('book');
    b.className = 'book open' + (side==='them' && $('side-them').className.indexOf('upright')<0 ? ' rot' : '');
    $('book-q').value = '';
    renderCats(); renderBook();
  }
  function closeBook(){ $('book').className = 'book'; }
  function renderCats(){
    var box = $('cats'); box.innerHTML='';
    CATS.forEach(function(c){
      var b = document.createElement('button'); b.type='button'; b.textContent = c; b.className = c===bookCat ? 'on' : '';
      b.addEventListener('click', function(){ bookCat = c; renderCats(); renderBook(); });
      box.appendChild(b);
    });
  }
  function renderBook(){
    var list = $('book-list'); list.innerHTML='';
    var q = norm($('book-q').value);
    var lang = them, n = 0;
    PHRASES.forEach(function(p){
      if(bookCat!=='全部' && p.c!==bookCat) return;
      var rd = readingOf(p,lang);
      if(q && norm(p.zh).indexOf(q)<0 && norm(p[lang]).indexOf(q)<0 && norm(rd).indexOf(q)<0) return;
      var b = document.createElement('button'); b.type='button'; b.className='ph';
      var z = document.createElement('div'); z.className='z'; z.textContent = p.zh;
      var f = document.createElement('div'); f.className='f'; f.textContent = p[lang];
      var r = document.createElement('div'); r.className='r'; r.textContent = rd;
      if(bookSide==='them'){ b.appendChild(f); if(rd) b.appendChild(r); b.appendChild(z); } else { b.appendChild(z); b.appendChild(f); if(rd) b.appendChild(r); }
      b.addEventListener('click', function(){ usePhrase(p); });
      list.appendChild(b); n++;
    });
    if(!n){ var e = document.createElement('div'); e.className='book-note'; e.textContent='找不到符合的片語'; list.appendChild(e); }
  }
  function usePhrase(p){
    closeBook();
    var lang = them, rd = readingOf(p,lang);
    if(bookSide==='zh'){
      addBubble('zh', 'me', p.zh, null, null);
      addBubble('them', 'them', p[lang], null, lang);
      var mine = addBubble('zh', 'me', p[lang], rd || null, lang); mine.style.background='#fbfaf6';
      speak(p[lang], lang);
    } else {
      addBubble('them', 'me', p[lang], null, null);
      addBubble('zh', 'them', p.zh, null, 'zh');
      var m2 = addBubble('them', 'me', p.zh, null, 'zh'); m2.style.background='#fbfaf6';
      speak(p.zh, 'zh');
    }
  }
  $('book-zh').addEventListener('click', function(){ openBook('zh'); });
  $('book-them').addEventListener('click', function(){ openBook('them'); });
  $('book-close').addEventListener('click', closeBook);
  $('book-q').addEventListener('input', renderBook);

  /* ── 字體大小（A 鈕循環：標準→大→特大→超大） ── */
  var FS = [1, 1.25, 1.5, 1.8], FS_NAME = ['標準','大','特大','超大'], fsIdx = 0;
  try{ fsIdx = parseInt(localStorage.getItem('fs-idx'),10) || 0; if(fsIdx<0||fsIdx>=FS.length) fsIdx = 0; }catch(e){}
  function applyFs(){
    document.documentElement.style.setProperty('--fs', FS[fsIdx]);
    ['zh','them'].forEach(function(side){ autosize(inputs[side]); logs[side].scrollTop = logs[side].scrollHeight; });
  }
  $('fsbtn').addEventListener('click', function(){
    fsIdx = (fsIdx+1) % FS.length;
    try{ localStorage.setItem('fs-idx', fsIdx); }catch(e){}
    applyFs(); toast('字體：'+FS_NAME[fsIdx]);
  });
  applyFs();

  /* ── 開站時測 Worker 連線 ── */
  function ping(){
    if(ENDPOINT!==WORKER_URL){ $('dot').className='dot ok'; return; }
    fetch(WORKER_URL+'/health', {method:'GET', cache:'no-store'}).then(function(r){
      $('dot').className = r.ok ? 'dot ok' : 'dot bad';
      if(!r.ok) toast('Worker 回應 HTTP '+r.status);
    }).catch(function(){
      $('dot').className = 'dot bad';
      toast(navigator.onLine===false ? '沒有網路：可用 📖 離線片語本' : '連不到 Worker：可用 📖 離線片語本');
    });
  }
  ping();
  window.addEventListener('online', ping);
  $('dot').addEventListener('click', ping);

  /* ── 翻轉對面（並排坐時用） ── */
  $('flip').addEventListener('click', function(){
    var s = $('side-them');
    s.className = s.className.indexOf('upright')>-1 ? 'side them' : 'side them upright';
  });

  applyLang();
})();
</script>
</body>
</html>
